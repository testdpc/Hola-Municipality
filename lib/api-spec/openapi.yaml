  # STOCK ADJUSTMENTS
  /stock-adjustments:
    get:
      operationId: listStockAdjustments
      tags: [stock-adjustments]
      summary: List stock adjustments
      responses:
        "200":
          description: Adjustments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockAdjustment"
    post:
      operationId: createStockAdjustment
      tags: [stock-adjustments]
      summary: Create stock adjustment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockAdjustmentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockAdjustment"

  /stock-adjustments/{id}:
    get:
      operationId: getStockAdjustment
      tags: [stock-adjustments]
      summary: Get stock adjustment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Adjustment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockAdjustment"

  # STOCK TAKING
  /stock-takings:
    get:
      operationId: listStockTakings
      tags: [stock-taking]
      summary: List stock taking sessions
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockTaking"
    post:
      operationId: createStockTaking
      tags: [stock-taking]
      summary: Create stock taking session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockTakingInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockTaking"

  /stock-takings/{id}:
    get:
      operationId: getStockTaking
      tags: [stock-taking]
      summary: Get stock taking session with items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockTaking"
    patch:
      operationId: updateStockTaking
      tags: [stock-taking]
      summary: Update stock taking (finalize)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockTakingUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockTaking"

  # NOTIFICATIONS
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: Get notifications for current user
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      responses:
        "200":
          description: All marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # AUDIT TRAIL
  /audit:
    get:
      operationId: listAuditLogs
      tags: [audit]
      summary: List audit log entries
      parameters:
        - name: userId
          in: query
          schema:
            type: ["number", "null"]
        - name: action
          in: query
          schema:
            type: ["string", "null"]
        - name: from
          in: query
          schema:
            type: ["string", "null"]
        - name: to
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Audit logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"

  # REPORTS
  /reports/current-stock:
    get:
      operationId: getReportCurrentStock
      tags: [reports]
      summary: Current stock report
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryItem"

  /reports/low-stock:
    get:
      operationId: getReportLowStock
      tags: [reports]
      summary: Low stock report
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryItem"

  /reports/department-consumption:
    get:
      operationId: getReportDepartmentConsumption
      tags: [reports]
      summary: Department consumption report
      parameters:
        - name: from
          in: query
          schema:
            type: ["string", "null"]
        - name: to
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DepartmentConsumptionRow"

  /reports/stock-movement:
    get:
      operationId: getReportStockMovement
      tags: [reports]
      summary: Monthly stock movement report
      parameters:
        - name: from
          in: query
          schema:
            type: ["string", "null"]
        - name: to
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockMovementRow"

  /reports/inventory-valuation:
    get:
      operationId: getReportInventoryValuation
      tags: [reports]
      summary: Inventory valuation report
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryValuationReport"

  /reports/supplier:
    get:
      operationId: getReportSupplier
      tags: [reports]
      summary: Supplier performance report
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupplierReportRow"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    SuccessResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    # AUTH
    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"

    # USER
    User:
      type: object
      required: [id, username, fullName, email, role, isActive, createdAt]
      properties:
        id:
          type: number
        username:
          type: string
        fullName:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [administrator, storekeeper, procurement_officer, finance_officer, department_user, auditor]
        department:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        isActive:
          type: boolean
        createdAt:
          type: string

    UserInput:
      type: object
      required: [username, fullName, email, role, password]
      properties:
        username:
          type: string
        fullName:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [administrator, storekeeper, procurement_officer, finance_officer, department_user, auditor]
        department:
          type: string
        phone:
          type: string
        password:
          type: string

    UserUpdate:
      type: object
      properties:
        fullName:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [administrator, storekeeper, procurement_officer, finance_officer, department_user, auditor]
        department:
          type: string
        phone:
          type: string
        isActive:
          type: boolean
        password:
          type: string

    # DASHBOARD
    DashboardStats:
      type: object
      required: [totalItems, totalValue, lowStockCount, outOfStockCount, pendingRequisitions, itemsReceivedToday, itemsIssuedToday]
      properties:
        totalItems:
          type: number
        totalValue:
          type: number
        lowStockCount:
          type: number
        outOfStockCount:
          type: number
        pendingRequisitions:
          type: number
        itemsReceivedToday:
          type: number
        itemsIssuedToday:
          type: number

    RecentTransaction:
      type: object
      required: [id, type, description, quantity, user, timestamp]
      properties:
        id:
          type: number
        type:
          type: string
          enum: [received, issued, returned, adjusted]
        description:
          type: string
        quantity:
          type: number
        user:
          type: string
        timestamp:
          type: string

    StockMovementChartPoint:
      type: object
      required: [month, received, issued]
      properties:
        month:
          type: string
        received:
          type: number
        issued:
          type: number

    # CATEGORY
    Category:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: number
        name:
          type: string
        description:
          type: ["string", "null"]
        createdAt:
          type: string

    CategoryInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string

    CategoryUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string

    # SUPPLIER
    Supplier:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: number
        name:
          type: string
        contactPerson:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        kraPin:
          type: ["string", "null"]
        physicalAddress:
          type: ["string", "null"]
        performanceRating:
          type: ["number", "null"]
        isActive:
          type: boolean
        createdAt:
          type: string

    SupplierInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        contactPerson:
          type: string
        phone:
          type: string
        email:
          type: string
        kraPin:
          type: string
        physicalAddress:
          type: string
        performanceRating:
          type: number

    SupplierUpdate:
      type: object
      properties:
        name:
          type: string
        contactPerson:
          type: string
        phone:
          type: string
        email:
          type: string
        kraPin:
          type: string
        physicalAddress:
          type: string
        performanceRating:
          type: number
        isActive:
          type: boolean

    # DEPARTMENT
    Department:
      type: object
      required: [id, name, isActive, createdAt]
      properties:
        id:
          type: number
        name:
          type: string
        description:
          type: ["string", "null"]
        isActive:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string

    DepartmentInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string

    DepartmentUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        isActive:
          type: boolean

    # UNIT
    Unit:
      type: object
      required: [id, name, isActive, createdAt]
      properties:
        id:
          type: number
        name:
          type: string
        abbreviation:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        isActive:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string

    UnitInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        abbreviation:
          type: string
        description:
          type: string

    UnitUpdate:
      type: object
      properties:
        name:
          type: string
        abbreviation:
          type: string
        description:
          type: string
        isActive:
          type: boolean

    # STORE
    Store:
      type: object
      required: [id, storeCode, name, isActive, createdAt]
      properties:
        id:
          type: number
        storeCode:
          type: string
        name:
          type: string
        location:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        isActive:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string

    StoreInput:
      type: object
      required: [storeCode, name]
      properties:
        storeCode:
          type: string
        name:
          type: string
        location:
          type: string
        description:
          type: string

    StoreUpdate:
      type: object
      properties:
        storeCode:
          type: string
        name:
          type: string
        location:
          type: string
        description:
          type: string
        isActive:
          type: boolean

    # INVENTORY ITEM
    InventoryItem:
      type: object
      required: [id, itemCode, itemName, categoryId, unitOfMeasure, currentQuantity, minimumStock, maximumStock, reorderLevel, purchasePrice, status, createdAt]
      properties:
        id:
          type: number
        itemCode:
          type: string
        barcodeQr:
          type: ["string", "null"]
        itemName:
          type: string
        categoryId:
          type: number
        categoryName:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        unitOfMeasure:
          type: string
        currentQuantity:
          type: number
        minimumStock:
          type: number
        maximumStock:
          type: number
        reorderLevel:
          type: number
        shelfBinLocation:
          type: ["string", "null"]
        purchasePrice:
          type: number
        supplierId:
          type: ["number", "null"]
        supplierName:
          type: ["string", "null"]
        dateReceived:
          type: ["string", "null"]
        expiryDate:
          type: ["string", "null"]
        status:
          type: string
          enum: [available, low_stock, out_of_stock]
        createdAt:
          type: string

    InventoryItemInput:
      type: object
      required: [itemName, categoryId, unitOfMeasure, currentQuantity, minimumStock, maximumStock, reorderLevel, purchasePrice]
      properties:
        itemCode:
          type: string
        barcodeQr:
          type: string
        itemName:
          type: string
        categoryId:
          type: number
        description:
          type: string
        unitOfMeasure:
          type: string
        currentQuantity:
          type: number
        minimumStock:
          type: number
        maximumStock:
          type: number
        reorderLevel:
          type: number
        shelfBinLocation:
          type: string
        purchasePrice:
          type: number
        supplierId:
          type: number
        dateReceived:
          type: string
        expiryDate:
          type: string

    InventoryItemUpdate:
      type: object
      properties:
        itemCode:
          type: string
        barcodeQr:
          type: string
        itemName:
          type: string
        categoryId:
          type: number
        description:
          type: string
        unitOfMeasure:
          type: string
        currentQuantity:
          type: number
        minimumStock:
          type: number
        maximumStock:
          type: number
        reorderLevel:
          type: number
        shelfBinLocation:
          type: string
        purchasePrice:
          type: number
        supplierId:
          type: number
        dateReceived:
          type: string
        expiryDate:
          type: string

    # PURCHASE ORDER
    PurchaseOrderItem:
      type: object
      required: [inventoryItemId, itemName, quantity, unitPrice, totalPrice]
      properties:
        id:
          type: number
        inventoryItemId:
          type: number
        itemName:
          type: string
        quantity:
          type: number
        unitPrice:
          type: number
        totalPrice:
          type: number

    PurchaseOrder:
      type: object
      required: [id, lpoNumber, supplierId, department, status, totalAmount, createdAt]
      properties:
        id:
          type: number
        lpoNumber:
          type: string
        supplierId:
          type: number
        supplierName:
          type: ["string", "null"]
        department:
          type: string
        requestedById:
          type: ["number", "null"]
        requestedByName:
          type: ["string", "null"]
        approvedById:
          type: ["number", "null"]
        approvedByName:
          type: ["string", "null"]
        status:
          type: string
          enum: [draft, pending_approval, approved, rejected, received]
        items:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseOrderItem"
        totalAmount:
          type: number
        notes:
          type: ["string", "null"]
        rejectionReason:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    PurchaseOrderInput:
      type: object
      required: [supplierId, department, items]
      properties:
        supplierId:
          type: number
        department:
          type: string
        notes:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseOrderItem"

    PurchaseOrderUpdate:
      type: object
      properties:
        supplierId:
          type: number
        department:
          type: string
        notes:
          type: string
        status:
          type: string
          enum: [draft, pending_approval, approved, rejected, received]
        items:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseOrderItem"

    RejectInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string

    # GRN
    GRNItem:
      type: object
      required: [inventoryItemId, itemName, quantityOrdered, quantityReceived, unitPrice]
      properties:
        id:
          type: number
        inventoryItemId:
          type: number
        itemName:
          type: string
        quantityOrdered:
          type: number
        quantityReceived:
          type: number
        unitPrice:
          type: number

    GoodsReceivedNote:
      type: object
      required: [id, grnNumber, supplierId, dateReceived, receivingOfficerId, inspectionStatus, status, createdAt]
      properties:
        id:
          type: number
        grnNumber:
          type: string
        purchaseOrderId:
          type: ["number", "null"]
        lpoNumber:
          type: ["string", "null"]
        supplierId:
          type: number
        supplierName:
          type: ["string", "null"]
        deliveryNoteNumber:
          type: ["string", "null"]
        dateReceived:
          type: string
        receivingOfficerId:
          type: number
        receivingOfficerName:
          type: ["string", "null"]
        inspectionStatus:
          type: string
          enum: [pending, passed, failed, partial]
        status:
          type: string
          enum: [draft, posted]
        items:
          type: array
          items:
            $ref: "#/components/schemas/GRNItem"
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    GRNInput:
      type: object
      required: [supplierId, dateReceived, receivingOfficerId, items]
      properties:
        supplierId:
          type: number
        purchaseOrderId:
          type: number
        deliveryNoteNumber:
          type: string
        dateReceived:
          type: string
        receivingOfficerId:
          type: number
        inspectionStatus:
          type: string
          enum: [pending, passed, failed, partial]
        notes:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/GRNItem"

    GRNUpdate:
      type: object
      properties:
        deliveryNoteNumber:
          type: string
        inspectionStatus:
          type: string
          enum: [pending, passed, failed, partial]
        status:
          type: string
          enum: [draft, posted]
        notes:
          type: string

    # STOCK ISSUE
    StockIssueItem:
      type: object
      required: [inventoryItemId, itemName, quantity]
      properties:
        id:
          type: number
        inventoryItemId:
          type: number
        itemName:
          type: string
        quantity:
          type: number

    StockIssue:
      type: object
      required: [id, requestNumber, department, requestedById, status, issueDate, createdAt]
      properties:
        id:
          type: number
        requestNumber:
          type: string
        department:
          type: string
        requestedById:
          type: number
        requestedByName:
          type: ["string", "null"]
        approvedById:
          type: ["number", "null"]
        approvedByName:
          type: ["string", "null"]
        issuedById:
          type: ["number", "null"]
        issuedByName:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, approved, issued, rejected]
        issueDate:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/StockIssueItem"
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    StockIssueInput:
      type: object
      required: [department, requestedById, issueDate, items]
      properties:
        department:
          type: string
        requestedById:
          type: number
        issueDate:
          type: string
        notes:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/StockIssueItem"

    # STOCK RETURN
    StockReturn:
      type: object
      required: [id, returnNumber, inventoryItemId, quantity, condition, reason, storekeeperI, returnDate, createdAt]
      properties:
        id:
          type: number
        returnNumber:
          type: string
        inventoryItemId:
          type: number
        itemName:
          type: ["string", "null"]
        quantity:
          type: number
        condition:
          type: string
          enum: [good, damaged, expired]
        reason:
          type: string
        storekeeperI:
          type: number
        storekeeperName:
          type: ["string", "null"]
        returnDate:
          type: string
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    StockReturnInput:
      type: object
      required: [inventoryItemId, quantity, condition, reason, storekeeperI, returnDate]
      properties:
        inventoryItemId:
          type: number
        quantity:
          type: number
        condition:
          type: string
          enum: [good, damaged, expired]
        reason:
          type: string
        storekeeperI:
          type: number
        returnDate:
          type: string
        notes:
          type: string

    # STOCK ADJUSTMENT
    StockAdjustment:
      type: object
      required: [id, adjustmentNumber, inventoryItemId, adjustmentType, quantityBefore, quantityAfter, reason, adjustedById, adjustmentDate, createdAt]
      properties:
        id:
          type: number
        adjustmentNumber:
          type: string
        inventoryItemId:
          type: number
        itemName:
          type: ["string", "null"]
        adjustmentType:
          type: string
          enum: [lost, damaged, expired, count_correction, other]
        quantityBefore:
          type: number
        quantityAfter:
          type: number
        reason:
          type: string
        adjustedById:
          type: number
        adjustedByName:
          type: ["string", "null"]
        adjustmentDate:
          type: string
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    StockAdjustmentInput:
      type: object
      required: [inventoryItemId, adjustmentType, quantityAfter, reason, adjustedById, adjustmentDate]
      properties:
        inventoryItemId:
          type: number
        adjustmentType:
          type: string
          enum: [lost, damaged, expired, count_correction, other]
        quantityAfter:
          type: number
        reason:
          type: string
        adjustedById:
          type: number
        adjustmentDate:
          type: string
        notes:
          type: string

    # STOCK TAKING
    StockTakingItem:
      type: object
      required: [inventoryItemId, itemName, systemQuantity, physicalQuantity, variance]
      properties:
        id:
          type: number
        inventoryItemId:
          type: number
        itemName:
          type: string
        systemQuantity:
          type: number
        physicalQuantity:
          type: number
        variance:
